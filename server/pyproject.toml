[project]
name = "fastapi-server-kit"
version = "0.1.1"
description = "A production-grade FastAPI template with support for PostgreSQL, SQLite, and MySQL."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "atnatewoshw", email = "icodeyt21@gmail.com" }
]
license = { text = "MIT" }
keywords = ["fastapi", "starter-template", "postgresql", "mysql", "sqlite", "asyncio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "aiomysql>=0.3.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.129.2",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "questionary>=2.0.1",
]

[project.scripts]
fastapi-server-kit = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "tests"]
include = [
    "/cli.py",
    "/README.md",
    "/.env_example",
    "/pyproject.toml.template"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
